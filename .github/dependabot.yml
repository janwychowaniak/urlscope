version: 2

# Version updates wait a week after a release (cooldown); security updates do not.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # The lower bounds in pyproject.toml are what CI's lowest-deps job proves,
    # so Dependabot only moves uv.lock and leaves the bounds alone.
    versioning-strategy: "lockfile-only"
