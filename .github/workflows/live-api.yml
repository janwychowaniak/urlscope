name: live-api

# Tests against the real urlscan.io API (tests/live, marker "live"). Each run makes
# two private scans of https://example.com. GitHub disables this schedule after 60
# days without repository activity; .githooks/pre-push warns when that happens.
on:
  schedule: [{ cron: '23 5 * * 1' }]   # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-api               # holds the URLSCAN_API_KEY secret; deploys from main only
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync

      - name: Run tests against the live urlscan.io API
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: uv run pytest tests/ -m live -v
