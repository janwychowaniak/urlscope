name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}   # .python-version would otherwise pick 3.15 for every job
      UV_LOCKED: "1"                            # fail if uv.lock is out of date instead of rewriting it
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/

      - name: Run Ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

  lowest-deps:
    # The lower bounds in pyproject.toml hold only as far as this job proves them:
    # the oldest supported Python with the oldest allowed httpx2 and pydantic.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Downgrade runtime dependencies to their lower bounds
        run: |
          uv pip compile pyproject.toml --resolution lowest-direct -o "$RUNNER_TEMP/lowest.txt"
          uv pip install -r "$RUNNER_TEMP/lowest.txt"
          uv pip list | grep -E '^(httpx2|httpcore2|pydantic|pydantic-core) '

      - name: Run tests
        run: uv run --no-sync pytest tests/   # --no-sync keeps the downgraded versions
