[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urlscope"
dynamic = ["version"]
description = "Python wrapper for the urlscan.io API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Jan Wychowaniak" },
]
classifiers = [
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/janwychowaniak/urlscope"
Source = "https://github.com/janwychowaniak/urlscope"
Issues = "https://github.com/janwychowaniak/urlscope/issues"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urlscope"]

[tool.hatch.version]
path = "src/urlscope/__init__.py"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls the real urlscan.io API; needs URLSCAN_API_KEY (uv run --env-file .env pytest -m live)",
]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
